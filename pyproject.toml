[project]
name = "jobsearcher"
version = "0.1.0"
description = "Private continuous ranked job-search workspace"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "joblib>=1.5.3",
    "numpy>=2.4.2",
    "requests>=2.32.5",
    "scikit-learn>=1.9.0",
    "waitress>=3.0.2",
]

[dependency-groups]
dev = [
    "pandas>=3.0.5",
]
